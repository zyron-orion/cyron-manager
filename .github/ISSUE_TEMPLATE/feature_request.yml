name: Feature request
description: Suggest a change or a new capability.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Downloads
        - Queue and scheduling
        - UI and accessibility
        - Browser bridge
        - GitHub integration
        - Build and packaging
        - Other
    validations:
      required: true
