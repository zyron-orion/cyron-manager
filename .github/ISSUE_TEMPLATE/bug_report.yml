name: Bug report
description: Report a reproducible problem in CYRON Manager.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, passwords, private URLs, database files, or browser profile data.
  - type: input
    id: version
    attributes:
      label: CYRON Manager version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials and private paths before posting.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed tokens, passwords, private URLs, and personal data from this report.
          required: true
        - label: I tested the latest release.
          required: true
